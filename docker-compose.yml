version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: xoomrides-db
    restart: always
    environment:
      POSTGRES_USER: xoomrides_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: xoomrides
    # Only expose port internally - not to host
    networks:
      - xoomrides-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xoomrides_user -d xoomrides"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xoomrides-backend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # Only expose to localhost for main Nginx
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xoomrides-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend - Main User App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xoomrides-frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"  # Only expose to localhost for main Nginx
    volumes:
      - uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - xoomrides-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Admin Interface
  admin:
    build:
      context: ./frontend-old-nawaride
      dockerfile: Dockerfile
    container_name: xoomrides-admin
    restart: always
    ports:
      - "127.0.0.1:8081:80"  # Only expose to localhost for main Nginx
    volumes:
      - uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - xoomrides-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  xoomrides-network:
    driver: bridge
    name: xoomrides-network
