# XOOM Rides - Host-Level Nginx Configuration
# Place this file in /etc/nginx/sites-available/xoomrides
# Then: sudo ln -s /etc/nginx/sites-available/xoomrides /etc/nginx/sites-enabled/
# This configuration works alongside your other apps on the same VPS

# Main Application - xoomrides.com
server {
    listen 80;
    listen [::]:80;
    server_name xoomrides.com www.xoomrides.com;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    
    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xoomrides.com www.xoomrides.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/xoomrides.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xoomrides.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Logging
    access_log /var/log/nginx/xoomrides_access.log combined;
    error_log /var/log/nginx/xoomrides_error.log warn;
    
    # Proxy to XOOM Frontend container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    
    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
    
    client_max_body_size 10M;
}

# Admin Dashboard - admin.xoomrides.com
